name: swarmnet-v2

services:
  px4_sitl:
    image: ${PX4_IMAGE:-swarmnet/px4-sitl@sha256:904f450277bc59147303be7cc0ba0006adcc8c14ea20a4c7c5efe13caf0cfeff}
    pull_policy: never
    platform: linux/arm64
    container_name: swarmnet_px4
    init: true
    working_dir: /opt/PX4-Autopilot
    environment:
      PX4_DIR: /opt/PX4-Autopilot
      HEADLESS: "1"
      QGC_HOST: host.docker.internal
      QGC_PORT: "14550"
      SWARM_OFFBOARD_LOCAL_BASE: "15000"
      SWARM_OFFBOARD_REMOTE_BASE: "16000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./px4_config:/px4_config:ro
      - ./logs/px4:/var/log/swarmnet/px4
    networks:
      - swarm_net
    command: ["sleep", "infinity"]
    mem_limit: 5g
    cpus: 3.0
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/PX4-Autopilot/build/px4_sitl_default/bin/px4 && getent hosts host.docker.internal"]
      interval: 10s
      timeout: 5s
      retries: 3

  ros2_nodes:
    image: ${ROS_IMAGE:-swarmnet/ros2-nodes@sha256:428618639cda845890386ef1b5e38604309ce3652c488022addae296942b8deb}
    pull_policy: never
    platform: linux/arm64
    container_name: swarmnet_ros2
    init: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///ros2_ws/src/swarmnet/config/cyclone_config.xml
    volumes:
      - ./swarmnet_ros2:/ros2_ws/src/swarmnet
      - ./logs/ros2:/ros2_ws/logs
      - ./config:/ros2_ws/src/swarmnet/config:ro
    networks:
      - swarm_net
    command: ["sleep", "infinity"]
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/humble/setup.sh && python3 -c 'import rclpy'"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  swarm_net:
    driver: bridge
